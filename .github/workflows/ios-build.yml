name: iOS build

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      # The site address and API key come from the repository secrets
      # KF_SITE_HOST and KF_API_KEY, so they never land in the code.
      - name: Build for simulator
        env:
          KF_SITE_HOST: ${{ secrets.KF_SITE_HOST }}
          KF_API_KEY: ${{ secrets.KF_API_KEY }}
        run: |
          set -o pipefail
          overrides=()
          [ -n "$KF_SITE_HOST" ] && overrides+=("KF_SITE_HOST=$KF_SITE_HOST")
          [ -n "$KF_API_KEY" ] && overrides+=("KF_API_KEY=$KF_API_KEY")
          xcodebuild \
            -project KelaketFilm.xcodeproj \
            -scheme KelaketFilm \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            "${overrides[@]}" \
            build | tee build.log

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log

      # Upload this zip to appetize.io to run the app in a browser.
      - name: Package simulator app
        run: |
          cd build/Build/Products/Debug-iphonesimulator
          zip -qry "$GITHUB_WORKSPACE/KelaketFilm-simulator.zip" KelaketFilm.app

      - name: Upload simulator app
        uses: actions/upload-artifact@v4
        with:
          name: KelaketFilm-simulator
          path: KelaketFilm-simulator.zip

      - name: Take screenshots in the simulator
        run: |
          APP=build/Build/Products/Debug-iphonesimulator/KelaketFilm.app
          BUNDLE_ID=$(/usr/libexec/PlistBuddy -c "Print CFBundleIdentifier" "$APP/Info.plist")
          UDID=$(xcrun simctl list devices available -j | python3 -c '
          import json, sys
          devices = json.load(sys.stdin)["devices"]
          phones = [d for runtime, items in devices.items() if "iOS" in runtime for d in items if d["name"].startswith("iPhone")]
          print(phones[-1]["udid"])')
          xcrun simctl boot "$UDID"
          xcrun simctl bootstatus "$UDID" -b
          xcrun simctl status_bar "$UDID" override --time "9:41" || true
          xcrun simctl install "$UDID" "$APP"
          mkdir -p screenshots
          xcrun simctl launch "$UDID" "$BUNDLE_ID"
          sleep 4
          xcrun simctl io "$UDID" screenshot screenshots/1-launch.png
          sleep 20
          xcrun simctl io "$UDID" screenshot screenshots/2-home.png
          # The film/series pages open through the app's own URL scheme.
          if [ -n "${{ vars.SAMPLE_POST_ID }}" ]; then
            xcrun simctl openurl "$UDID" "kelaketfilm://app/film/${{ vars.SAMPLE_POST_ID }}"
            sleep 12
            xcrun simctl io "$UDID" screenshot screenshots/3-film.png
          fi
          xcrun simctl spawn "$UDID" log show --last 2m --predicate 'process == "KelaketFilm"' --style compact > screenshots/app.log || true

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: screenshots
