name: iOS build

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      # The site address and API key come from the repository secrets
      # KF_SITE_HOST and KF_API_KEY, so they never land in the code.
      - name: Build, package and take screenshots
        env:
          KF_SITE_HOST: ${{ secrets.KF_SITE_HOST }}
          KF_API_KEY: ${{ secrets.KF_API_KEY }}
          SAMPLE_POST_ID: ${{ vars.SAMPLE_POST_ID }}
        run: bash ci/simulator-build.sh

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log

      # Upload this zip to appetize.io to run the app in a browser.
      - name: Upload simulator app
        uses: actions/upload-artifact@v4
        with:
          name: KelaketFilm-simulator
          path: KelaketFilm-simulator.zip

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: screenshots
