# Codemagic build (free Mac minutes). Set KF_SITE_HOST, KF_API_KEY and,
# optionally, GOOGLE_SERVICE_INFO_PLIST (base64) and SAMPLE_POST_ID in an
# environment group named "kelaket" (Codemagic app → Environment variables),
# marked Secure.
workflows:
  ios:
    name: iOS build
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      xcode: latest
      cocoapods: default
      groups:
        - kelaket
    triggering:
      events:
        - push
    scripts:
      - name: Build, package and take screenshots
        script: bash ci/build.sh
    artifacts:
      - build.log
      - KelaketFilm-unsigned.ipa
      - KelaketFilm-simulator.zip
      - screenshots/*
