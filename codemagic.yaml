# Codemagic build (free Mac minutes). Set KF_SITE_HOST, KF_API_KEY and,
# optionally, SAMPLE_POST_ID in an environment group named "kelaket"
# (Codemagic app → Environment variables), marked Secure.
workflows:
  ios-simulator:
    name: iOS simulator build
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      xcode: latest
      groups:
        - kelaket
    triggering:
      events:
        - push
    scripts:
      - name: Build, package and take screenshots
        script: bash ci/simulator-build.sh
    artifacts:
      - build.log
      - KelaketFilm-simulator.zip
      - screenshots/*
