name: KelaketFilm
options:
  bundleIdPrefix: ir.kelaketfilm
  deploymentTarget:
    iOS: "16.0"
  developmentLanguage: fa
  createIntermediateGroups: true

configFiles:
  Debug: Config/Config.xcconfig
  Release: Config/Config.xcconfig

settings:
  base:
    SWIFT_VERSION: "5.9"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    TARGETED_DEVICE_FAMILY: "1,2"

packages:
  Firebase:
    url: https://github.com/firebase/firebase-ios-sdk
    from: "11.0.0"

targets:
  KelaketFilm:
    type: application
    platform: iOS
    sources:
      - path: KelaketFilm
    dependencies:
      - package: Firebase
        product: FirebaseMessaging
      - package: Firebase
        product: FirebaseAnalytics
    entitlements:
      path: KelaketFilm/Resources/KelaketFilm.entitlements
      properties:
        aps-environment: development
    info:
      path: KelaketFilm/Resources/Info.plist
      properties:
        CFBundleDisplayName: $(APP_DISPLAY_NAME)
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleDevelopmentRegion: fa
        CFBundleLocalizations: [fa]
        CFBundleURLTypes:
          - CFBundleURLName: $(KF_BUNDLE_ID)
            CFBundleURLSchemes: [kelaketfilm]
        UILaunchScreen:
          UIColorName: LaunchBackground
        UIApplicationSupportsIndirectInputEvents: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UIBackgroundModes: [audio, fetch, remote-notification]
        BGTaskSchedulerPermittedIdentifiers: [$(KF_BUNDLE_ID).refresh]
        # Google Cast device discovery (CC1AD845 is the Default Media Receiver).
        NSBonjourServices: [_googlecast._tcp, _CC1AD845._googlecast._tcp]
        NSLocalNetworkUsageDescription: برای پیدا کردن تلویزیون و Chromecast در شبکه خانگی، جهت پخش ویدیو روی آن‌ها
        KFAppNameEn: $(APP_DISPLAY_NAME_EN)
        KFSiteHost: $(KF_SITE_HOST)
        KFHostListURL: $(KF_HOST_LIST_URL)
        KFApiKey: $(KF_API_KEY)
        KFPushTopics: $(KF_PUSH_TOPICS)
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(KF_BUNDLE_ID)
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: $(KF_TEAM_ID)

  # Logic tests, run in CI. They compile the model and helper sources
  # directly, so they need neither the app nor its pods.
  KelaketFilmTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: KelaketFilmTests
      - path: KelaketFilm/Core/Models
      - path: KelaketFilm/Core/Storage/Region.swift
      - path: KelaketFilm/Core/Storage/Localizer.swift
      - path: KelaketFilm/Core/Network/OfflineCache.swift
      - path: KelaketFilm/Shared/Theme.swift
      - path: KelaketFilm/Features/Player/Subtitles.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(KF_BUNDLE_ID).tests
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGNING_ALLOWED: NO
    scheme:
      testTargets: [KelaketFilmTests]

  # Taps through the app against the live site (see ci/build.sh).
  KelaketFilmUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: KelaketFilmUITests
    dependencies:
      - target: KelaketFilm
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(KF_BUNDLE_ID).uitests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: KelaketFilm
    scheme:
      testTargets: [KelaketFilmUITests]
